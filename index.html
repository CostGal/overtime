<style>

    --ink:#EFEFED; --ink2:#8C8C86; --acc:#D97757; --acc-soft:#2B1A14;
    --bad:#E5484D; --bad-soft:#2B1214;

  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent; touch-action:manipulation}
  html{background:var(--bg); -webkit-text-size-adjust:100%}
  body{
    margin:0;
    padding:calc(env(safe-area-inset-top) + 18px)
            calc(env(safe-area-inset-right) + 16px)
            calc(env(safe-area-inset-bottom) + 96px)
            calc(env(safe-area-inset-left) + 16px);
    background:var(--bg); color:var(--ink);
    font-family:var(--fut); font-size:16px; line-height:1.45; letter-spacing:.005em;

    -webkit-font-smoothing:antialiased; overscroll-behavior-y:none;
  }

  button{font-family:inherit; -webkit-user-select:none; user-select:none; cursor:pointer; color:var(--ink)}
  button:active{opacity:.65}
  input,select,textarea{font-family:inherit; font-size:16px; color:var(--ink); background:var(--card2); border:1px solid var(--rule); border-radius:10px}
  input,select{padding:11px 12px; width:100%; min-width:0}
  input[type=date]{-webkit-appearance:none; appearance:none; min-height:46px}
  ::placeholder{color:#5E5E57}

  .topbar{display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:14px}
  .topbar h1{font-size:22px; letter-spacing:.06em; text-transform:uppercase}
  .nav{display:flex; gap:6px; flex:none; align-items:center}
  .nav button{font-size:19px; width:46px; height:44px; color:var(--ink2); line-height:1;
    background:var(--card); border:1px solid var(--rule); border-radius:10px}
  .nav .today{width:auto; padding:0 14px; font-size:14px; color:var(--acc)}
  .livepill{font-size:12px; letter-spacing:.12em; text-transform:uppercase; color:var(--acc);
    border:1px solid var(--acc); border-radius:20px; padding:4px 10px; background:var(--acc-soft)}
  /* Beta build marks itself so it can never be mistaken for the real log. */

  .status{margin:0 0 22px; padding:15px 16px; background:var(--card);
    border:1px solid var(--rule); border-left:3px solid var(--acc);
    border-radius:10px; font-size:15px; line-height:1.55; color:var(--ink2)}
  .status b{color:var(--ink); font-weight:500}

  section{margin-bottom:32px}
  .head{display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:13px; padding-bottom:9px; border-bottom:1px solid var(--rule)}

  .head .sub{font-size:13px; color:var(--ink2)}
  .head .nav button{width:38px; height:36px; font-size:16px}
  .head .nav .today{width:auto; padding:0 11px; font-size:13px}

  .form{display:flex; flex-direction:column; gap:14px; padding:16px; background:var(--card); border:1px solid var(--rule); border-radius:12px; margin-bottom:16px}
  .form.editing{border-color:var(--acc)}
  .form label{min-width:0; font-size:12.5px; letter-spacing:.1em; text-transform:uppercase; color:var(--ink2); display:flex; flex-direction:column; gap:6px}
  .seg{display:flex; gap:6px}
  /* flex:1 1 0 + min-width:0 so the three buttons always share the row and the

    display:flex; align-items:center; justify-content:center; gap:7px}

  .seg button .lbl{min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}

  .daterow{display:flex; gap:6px}
  .daterow input{flex:1}
  .daterow button{flex:none; min-height:46px; padding:0 12px; font-size:13.5px; color:var(--ink2); background:var(--card2); border:1px solid var(--rule); border-radius:10px}

  .dur{display:flex; align-items:center; justify-content:space-between; gap:6px}

  .stepper{display:flex; flex-direction:column; align-items:center; gap:6px}

  .stepper button{width:44px; height:46px; font-size:20px; background:var(--card2); border:1px solid var(--rule); border-radius:10px; color:var(--ink2)}
  .quick{display:flex; flex-wrap:wrap; gap:6px}
  .quick button{min-height:40px; padding:0 13px; font-size:14px; color:var(--ink2); background:var(--card2); border:1px solid var(--rule); border-radius:20px}
  .quick button.on{color:var(--acc); border-color:var(--acc)}
  .btnrow{display:flex; gap:8px}
  .btnrow button{flex:1; min-height:50px; font-size:15px; background:var(--card2); border:1px solid var(--rule); border-radius:11px}
  .btnrow button.pri{background:var(--acc); border-color:var(--acc); color:#100E0D}

  .msg{font-size:13.5px; color:var(--acc); min-height:18px; margin:4px 0 0}

  .row.tap{cursor:pointer}
  .row .d{flex:none; width:92px; font-size:15px}
  .row .d small{display:block; font-size:12px; color:var(--ink2)}
  .row .name{flex:1; min-width:0; font-size:14px; color:var(--ink2); overflow:hidden; text-overflow:ellipsis; white-space:nowrap}

  .k-absence {--kc:#7FA8C9; --kc-soft:#151E26; --kc-line:#25333F}
  .k-bonus   {--kc:#D4A24C; --kc-soft:#241C0F; --kc-line:#3B2F19}
  .ico{display:inline-flex; align-items:center; justify-content:center; flex:none; color:var(--kc,var(--ink2))}
  .ico svg{width:1em; height:1em; display:block}
  .row .ico{font-size:17px; width:22px}
  .row.k-absence .v,.row.k-bonus .v{color:var(--kc)}

  .stats{display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-bottom:22px}
  .stat{background:var(--card); border:1px solid var(--rule); border-radius:11px; padding:12px 14px}
  .stat .k{font-size:11.5px; letter-spacing:.12em; text-transform:uppercase; color:var(--ink2)}
  .stat .n{font-size:22px; margin-top:2px}
  .stat .n small{font-size:13px; color:var(--ink2)}
  .stat.hi{border-color:var(--acc); background:var(--acc-soft)}
  .stat.hi .n{color:var(--acc)}
  .stat.wide{grid-column:span 2}
  .stat.kind{border-color:var(--kc-line); background:var(--kc-soft)}
  .stat.kind .n{color:var(--kc)}
  .stat .k{display:flex; align-items:center; gap:6px}
  .stat .k .ico{font-size:13px}

  table{width:100%; border-collapse:collapse; font-size:14px}
  th{font-weight:400; font-size:11.5px; letter-spacing:.1em; text-transform:uppercase; color:var(--ink2); text-align:right; padding:0 0 8px}

  tr.cur td{color:var(--acc)}

  /* Report tab: horizontal bars and a single stacked split. */
  .bars{display:flex; flex-direction:column; gap:10px}
  .bar{display:flex; align-items:center; gap:10px; font-size:13.5px; color:var(--ink2)}

  .bar .track{flex:1; min-width:0; height:8px; background:var(--card2); border-radius:5px; overflow:hidden}

  .link{font-size:13px; word-break:break-all; color:var(--ink2); background:var(--card2); border:1px solid var(--rule); border-radius:10px; padding:11px 12px}

  .tabbar{position:fixed; left:0; right:0; bottom:0; z-index:10; display:flex; justify-content:center; gap:6px;

    background:rgba(0,0,0,.92); -webkit-backdrop-filter:blur(14px); backdrop-filter:blur(14px);

  /* Safari's address bar only goes away once the app is on the Home Screen, so

  .hint{display:flex; gap:10px; align-items:flex-start; margin:0 0 16px; padding:12px 14px;

  .hint b{color:var(--ink); font-weight:500}
  .hint button{flex:none; background:none; border:0; color:var(--ink2); font-size:20px; line-height:1; padding:0 2px; min-height:24px}

  .sheet{position:fixed; inset:0; z-index:40; display:flex; align-items:center; justify-content:center;
    padding:calc(env(safe-area-inset-top) + 20px) 18px calc(env(safe-area-inset-bottom) + 20px);
    background:rgba(0,0,0,.84); -webkit-backdrop-filter:blur(8px); backdrop-filter:blur(8px)}
  .sheetcard{width:100%; max-width:400px; background:var(--card); border:1px solid var(--rule); border-radius:16px; padding:22px}
  .sheetcard h2{font-size:20px; letter-spacing:.01em; margin:15px 0 9px; text-transform:none; color:var(--ink)}
  .sheetcard p{margin:0 0 20px; font-size:15px; color:var(--ink2); line-height:1.55}
  .sheetcard .ico{font-size:26px}
  .dots{display:flex; gap:6px; align-items:center}
  .dots span{width:7px; height:7px; border-radius:50%; background:var(--rule); transition:width .18s, background .18s}
  .dots span.on{background:var(--acc); width:18px; border-radius:4px}

  .auth{max-width:360px; margin:12vh auto 0; display:flex; flex-direction:column; gap:12px}
  .auth h1{font-size:26px; letter-spacing:.08em; text-transform:uppercase; margin-bottom:8px}
  .authlink{background:none; border:none; padding:2px 0; align-self:flex-start; font-size:13.5px; color:var(--ink2); text-decoration:underline}
  #toast{position:fixed; left:16px; right:16px; bottom:calc(env(safe-area-inset-bottom) + 84px); z-index:20;
    background:var(--bad-soft); border:1px solid var(--bad); color:var(--ink); border-radius:11px;
    padding:12px 14px; font-size:14px; display:none}
  #toast.ok{background:var(--acc-soft); border-color:var(--acc)}
  #load{position:fixed; left:0; top:0; height:2px; width:100%; z-index:30; background:var(--acc);

  #load.on{transform:scaleX(.9)}
  button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--acc); outline-offset:3px}
</style>

<div id="app"></div>
<div id="load"></div>
<div id="toast"></div>

<script>
/* One backend: Kostas's personal Supabase project (shared with Ledger's sandbox).
   The key is publishable. RLS on every ot_* table is the real gate; the only
   thing anon can reach is the ot_public_report() RPC used by boss.html. */
/* --- deployment config: the only lines that differ in the beta repo --- */
const SB_URL='https://dgnxbcoxdpdloplkcmzs.supabase.co';
const SB_KEY='sb_publishable_kXCrlX-9S1ud3bs9Zdyt1A_9n-U1X1F';
const IS_BETA=false;          // the closed-beta deployment sets this true
/* --------------------------------------------------------------------- */
const SESS_KEY='overtime_session';

/* ---------- utils ---------- */
const MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const MONF=['January','February','March','April','May','June','July','August','September','October','November','December'];
const DOW=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const KINDS={overtime:'Overtime', absence:'Absence', bonus:'Bonus'};
/* One mark per kind. Stroke-only and sized in em so they take the colour and
   size of whatever they sit in. Constant markup — never user input. */
const ICONS={
  overtime:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>',
  absence :'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M8 3v4M16 3v4M9 14h6"/></svg>',
  bonus   :'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3.5l2.6 5.5 6 .9-4.3 4.2 1 6-5.3-2.8-5.3 2.8 1-6L3.4 9.9l6-.9z"/></svg>'
};
function icon(kind){ const s=el('span',{class:'ico'}); s.innerHTML=ICONS[kind]||''; return s; }
function el(tag, props, ...kids){
  const n=document.createElement(tag);
  if(props) for(const k in props){
    if(k==='class') n.className=props[k];
    else if(k.slice(0,2)==='on') n[k]=props[k];
    else if(k==='hidden'||k==='disabled'||k==='value'||k==='checked') n[k]=props[k];
    else n.setAttribute(k, props[k]);
  }
  kids.flat().forEach(c=>{ if(c!=null && c!==false) n.appendChild(typeof c==='string'||typeof c==='number'?document.createTextNode(String(c)):c); });
  return n;
}
function key(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function parseKey(s){ const p=s.split('-'); return new Date(+p[0], +p[1]-1, +p[2]); }
function addDays(d,n){ const x=new Date(d); x.setDate(x.getDate()+n); return x; }
function todayD(){ const t=new Date(); t.setHours(0,0,0,0); return t; }
function monthKey(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0'); }
function monthStart(d){ return new Date(d.getFullYear(), d.getMonth(), 1); }
function monthEnd(d){ return new Date(d.getFullYear(), d.getMonth()+1, 0); }
function addMonths(d,n){ return new Date(d.getFullYear(), d.getMonth()+n, 1); }
function dmy(s){ const p=s.split('-'); return p[2]+'/'+p[1]+'/'+p[0]; }
function hm(min){ min=Math.round(min); const h=Math.floor(min/60), m=min%60;
  return h&&m ? h+'h '+m+'m' : h ? h+'h' : m+'m'; }
function hours(min){ const h=Math.round(min/60*100)/100; return String(h); }
function eur(x){ return '€'+(Math.round((+x||0)*100)/100).toLocaleString('el-GR',{minimumFractionDigits:2, maximumFractionDigits:2}); }
function toast(m, ok){ const t=document.getElementById('toast'); t.textContent=m; t.className=ok?'ok':''; t.style.display='block';
  clearTimeout(toast._x); toast._x=setTimeout(()=>t.style.display='none', ok?2200:4000); }
let busyN=0;
function busy(on){ busyN=Math.max(0, busyN+(on?1:-1)); document.getElementById('load').classList.toggle('on', busyN>0); }
function randToken(){ const b=new Uint8Array(12); crypto.getRandomValues(b); return Array.from(b,x=>x.toString(16).padStart(2,'0')).join(''); }

/* ---------- Greek public holidays (for "workable days") ---------- */
function orthodoxEaster(y){           // Meeus, Julian calendar + 13 days (valid 1900–2099)
  const a=y%4, b=y%7, c=y%19, d=(19*c+15)%30, e=(2*a+4*b-d+34)%7;
  const mo=Math.floor((d+e+114)/31), da=((d+e+114)%31)+1;
  return addDays(new Date(y, mo-1, da), 13);
}
const HOL={};
function holidays(y){
  if(HOL[y]) return HOL[y];
  const s=new Set(['01-01','01-06','03-25','05-01','08-15','10-28','12-25','12-26'].map(x=>y+'-'+x));
  const E=orthodoxEaster(y);
  [-48,-2,1,50].forEach(n=>s.add(key(addDays(E,n))));  // Clean Mon, Good Fri, Easter Mon, Holy Spirit Mon
  return HOL[y]=s;
}
function workdays(m){
  let n=0; const end=monthEnd(m);
  for(let d=new Date(m); d<=end; d=addDays(d,1)){
    const w=d.getDay(); if(w&&w<6&&!holidays(d.getFullYear()).has(key(d))) n++;
  }
  return n;
}

/* ---------- auth + api ---------- */
function sess(){ try{ return JSON.parse(localStorage.getItem(SESS_KEY)||'null'); }catch(e){ return null; } }
function setSess(s){ try{ if(s) localStorage.setItem(SESS_KEY, JSON.stringify(s)); else localStorage.removeItem(SESS_KEY); }catch(e){} }
async function authReq(path, body, method, token){
  const h={apikey:SB_KEY,'Content-Type':'application/json'}; if(token) h.Authorization='Bearer '+token;
  const r=await fetch(SB_URL+'/auth/v1/'+path,{method:method||'POST', headers:h, body:JSON.stringify(body)});
  const d=await r.json().catch(()=>({}));
  if(!r.ok) throw new Error(d.msg||d.error_description||d.message||('Auth error '+r.status));
  return d;
}
function recoveryFromHash(){
  const p=new URLSearchParams(location.hash.replace(/^#/,''));
  if(p.get('type')!=='recovery' || !p.get('access_token')) return null;
  return {access_token:p.get('access_token'), refresh_token:p.get('refresh_token'), expires_in:+p.get('expires_in')||3600, token_type:'bearer'};
}
let refreshing=null;
function refreshSession(){
  if(refreshing) return refreshing;
  refreshing=(async()=>{
    try{ const s=sess(); if(!s||!s.refresh_token) throw new Error('signed out');
      const d=await authReq('token?grant_type=refresh_token',{refresh_token:s.refresh_token}); setSess(d); return d; }
    finally{ refreshing=null; }
  })();
  return refreshing;
}
async function api(path, opts, retry){
  opts=opts||{}; if(retry===undefined) retry=true;
  const s=sess(); if(!s) throw new Error('signed out');
  const r=await fetch(SB_URL+'/rest/v1/'+path,{
    method:opts.method||'GET',
    headers:Object.assign({apikey:SB_KEY, Authorization:'Bearer '+s.access_token, 'Content-Type':'application/json'}, opts.headers||{}),
    body:opts.body!==undefined?JSON.stringify(opts.body):undefined
  });
  if(r.status===401 && retry){ try{ await refreshSession(); }catch(e){ setSess(null); boot(); throw e; } return api(path,opts,false); }
  if(!r.ok){ const t=await r.text(); throw new Error('DB '+r.status+': '+t.slice(0,160)); }
  if(r.status===204) return [];
  const txt=await r.text(); return txt?JSON.parse(txt):[];
}
const REP={headers:{Prefer:'return=representation'}};

/* ---------- state + data ---------- */
/* Everything is small (a few hundred rows a year), so it's all loaded once at
   boot and every calculation runs in memory. Mutate S, then render(). */
/* S.draft holds the add form's half-typed state. It lives here rather than in
   entryForm's closure so a re-render — a background refetch, a tab switch —
   doesn't throw away what you were in the middle of typing. */
const S={view:'log', month:monthStart(todayD()), logMonth:null, reportYear:null, entries:[], periods:[], share:null, edit:null, draft:null, guide:null};

async function loadAll(){
  const [e,p,s]=await Promise.all([
    api('ot_entries?select=*&order=date.desc,created_at.desc'),
    api('ot_pay_periods?select=*&order=effective_from.asc'),
    api('ot_share?select=*')
  ]);
  S.entries=e; S.periods=p;
  if(s[0]) S.share=s[0];
  else{
    /* First boot for this account. user_id is the primary key, so two devices
       booting at once means one of these POSTs loses — read the winner's row
       back rather than dying on the conflict. */
    try{ S.share=(await api('ot_share',{method:'POST', body:{}, headers:REP.headers}))[0]; }
    catch(err){ S.share=(await api('ot_share?select=*'))[0]; }
    if(!S.share) throw new Error('Could not set up the boss view for this account.');
  }
}
function sortEntries(){ S.entries.sort((a,b)=> a.date<b.date?1 : a.date>b.date?-1 : (a.created_at<b.created_at?1:-1)); }
async function saveEntry(row, id){
  busy(true);
  try{
    /* PostgREST answers with [] when nothing matched — e.g. the row was deleted on
       another device. Splicing that undefined into S.entries breaks every later
       render, so fail loudly instead. */
    if(id){ const r=await api('ot_entries?id=eq.'+id,{method:'PATCH', body:row, headers:REP.headers});
      if(!r[0]) throw new Error('That entry no longer exists — it may have been deleted on another device.');
      S.entries=S.entries.map(x=>x.id===id?r[0]:x); }
    else { const r=await api('ot_entries',{method:'POST', body:row, headers:REP.headers});
      if(!r[0]) throw new Error('Saved nothing — the database returned an empty row.');
      S.entries.push(r[0]); }
    sortEntries();
  } finally { busy(false); }
}
async function deleteEntry(id){
  busy(true);
  try{ await api('ot_entries?id=eq.'+id,{method:'DELETE'}); S.entries=S.entries.filter(x=>x.id!==id); }
  finally{ busy(false); }
}
async function patchShare(patch){
  busy(true);
  try{ const r=await api('ot_share?user_id=eq.'+S.share.user_id,{method:'PATCH', body:patch, headers:REP.headers}); S.share=r[0]; }
  finally{ busy(false); }
}

/* ---------- pay maths ---------- */
/* Pay terms apply from effective_from until the next period starts. */
function periodFor(dateStr){
  let p=null; for(const x of S.periods) if(x.effective_from<=dateStr) p=x; return p;
}
/* Day of the month wages land. Falls back to the 5th so the app still behaves
   sensibly for a period saved before payday became editable. */
function paydayFor(m){ const p=periodFor(key(monthStart(m))); return p&&p.payday!=null ? +p.payday : 5; }
/* Contracted hours in a month — the denominator for an effective hourly wage.
   168 = 21 days x 8h, which is exactly how the original OT rate was derived. */
function baseHoursFor(m){ const p=periodFor(key(monthStart(m))); return p&&p.base_hours!=null ? +p.base_hours : 168; }
/* What an hour of overtime is worth against an hour of ordinary time. */
function premiumFor(m){
  const p=periodFor(key(monthStart(m))); if(!p) return null;
  const bh=p.base_hours!=null?+p.base_hours:168;
  const plain=(+p.bank + +p.cash_base)/bh;
  if(!(plain>0)) return null;
  return {plain:plain, rate:+p.ot_rate, pct:(+p.ot_rate/plain-1)*100};
}
/* Everything the Report tab needs for one year, in a single pass. */
function reportStats(y){
  const r={otMin:0, otPay:0, bonus:0, absMin:0, base:0, baseHours:0, otDays:0, workDays:0,
           months:[], byDow:[0,0,0,0,0,0,0], best:null, quiet:null};
  for(let i=0;i<12;i++){
    const d=new Date(y,i,1), c=monthCalc(d);
    if(!c.rows.length) continue;
    r.otMin+=c.ot; r.otPay+=c.otPay; r.bonus+=c.bonus; r.absMin+=c.abs;
    r.otDays+=c.otDays; r.workDays+=c.work;
    r.base += c.bank + (c.cash - c.otPay - c.bonus);   // bank + cash_base, before extras
    r.baseHours += baseHoursFor(d);
    r.months.push({d:d, c:c});
    if(!r.best  || c.ot>r.best.c.ot ) r.best ={d:d, c:c};
    if(!r.quiet || c.ot<r.quiet.c.ot) r.quiet={d:d, c:c};
  }
  for(const e of S.entries)
    if(e.kind==='overtime' && +e.date.slice(0,4)===y) r.byDow[parseKey(e.date).getDay()]+=e.minutes;
  r.totalPay=r.base + r.otPay + r.bonus;
  r.paidHours=r.baseHours + r.otMin/60 - r.absMin/60;
  r.effective=r.paidHours>0 ? r.totalPay/r.paidHours : 0;
  r.otShare=r.totalPay>0 ? (r.otPay+r.bonus)/r.totalPay*100 : 0;
  return r;
}
function monthCalc(m){
  const mk=monthKey(m), p=periodFor(key(monthStart(m)));
  const rows=S.entries.filter(e=>e.date.slice(0,7)===mk);
  let ot=0, abs=0, bonus=0, otPay=0; const days=new Set();
  for(const e of rows){
    if(e.kind==='overtime'){ ot+=e.minutes; days.add(e.date); const r=periodFor(e.date); otPay+=e.minutes/60*(r?+r.ot_rate:0); }
    else if(e.kind==='absence') abs+=e.minutes;
    else if(e.kind==='bonus') bonus+=+e.amount||0;
  }
  const bank=p?+p.bank:0, cash=(p?+p.cash_base:0)+otPay+bonus;
  return {rows, ot, abs, bonus, otPay, otDays:days.size, work:workdays(monthStart(m)), bank, cash, total:bank+cash, hasPay:!!p};
}

/* ---------- entry form (add + edit) ---------- */
function entryForm(existing){
  const t0=todayD();
  const f=existing ? {kind:existing.kind, date:existing.date, minutes:existing.minutes, amount:existing.amount, note:existing.note||''}
                   : (S.draft = S.draft || {kind:'overtime', date:key(t0), minutes:60, amount:'', note:''});
  const msg=el('p',{class:'msg'});
  const box=el('div',{class:'form'+(existing?' editing':'')});
  function draw(){
    box.innerHTML='';
    const add=(...n)=>n.forEach(x=>{ if(x) box.appendChild(x); });
    const date=el('input',{type:'date', value:f.date, max:key(addDays(t0,1)), onchange:e=>{ f.date=e.target.value; draw(); }});
    const quickDay=(label,d)=>el('button',{class:f.date===key(d)?'on':'', onclick:()=>{ f.date=key(d); draw(); }},label);
    add(
      existing ? el('div',{class:'head', style:'margin:0; padding:0; border:0'}, el('h2',null,'Edit entry')) : null,
      el('div',{class:'seg'}, Object.keys(KINDS).map(k=>el('button',{class:'k-'+k, 'aria-pressed':String(f.kind===k),
        onclick:()=>{ f.kind=k; draw(); }}, icon(k), el('span',{class:'lbl'},KINDS[k])))),
      el('label',null,'Date', el('div',{class:'daterow'}, date, quickDay('Today',t0), quickDay('Yest.',addDays(t0,-1))))
    );
    if(f.kind==='bonus'){
      add(el('label',null,'Amount (€)',
        el('input',{type:'number', inputmode:'decimal', step:'0.01', min:'0', placeholder:'0.00', value:f.amount==null?'':String(f.amount),
          oninput:e=>{ f.amount=e.target.value; }})));
    } else {
      const h=Math.floor(f.minutes/60), m=f.minutes%60;
      const step=(d)=>{ f.minutes=Math.max(0, Math.min(1440, f.minutes+d)); draw(); };
      add(
        el('div',{class:'dur'},
          el('div',{class:'stepper'}, el('span',{class:'k'},'Hours'), el('div',null,
            el('button',{onclick:()=>step(-60), 'aria-label':'minus hour'},'−'), el('button',{onclick:()=>step(60), 'aria-label':'plus hour'},'+'))),
          el('div',{class:'val'}, String(h), el('small',null,'h'), String(m).padStart(2,'0'), el('small',null,'m')),
          el('div',{class:'stepper'}, el('span',{class:'k'},'Minutes'), el('div',null,
            el('button',{onclick:()=>step(-5), 'aria-label':'minus 5 minutes'},'−'), el('button',{onclick:()=>step(5), 'aria-label':'plus 5 minutes'},'+')))),
        el('div',{class:'quick'}, [30,45,60,90,120,150,180,240].map(n=>
          el('button',{class:f.minutes===n?'on':'', onclick:()=>{ f.minutes=n; draw(); }}, hm(n))))
      );
    }
    add(
      el('label',null,'Note (private)', el('input',{type:'text', value:f.note, placeholder:'Optional', oninput:e=>{ f.note=e.target.value; }})),
      el('div',{class:'btnrow'},
        existing ? el('button',{class:'danger', onclick:del},'Delete') : null,
        existing ? el('button',{onclick:()=>{ S.edit=null; render(); }},'Cancel') : null,
        el('button',{class:'pri', onclick:save}, existing?'Save':'Log it')),
      msg);
  }
  async function save(){
    msg.className='msg'; msg.textContent='';
    if(!f.date){ msg.className='msg err'; msg.textContent='Pick a date.'; return; }
    const row={kind:f.kind, date:f.date, note:f.note.trim()||null};
    if(f.kind==='bonus'){
      const a=parseFloat(String(f.amount).replace(',','.'));
      if(!(a>=0)){ msg.className='msg err'; msg.textContent='Enter an amount.'; return; }
      row.amount=a; row.minutes=0;
    } else {
      if(f.minutes<=0){ msg.className='msg err'; msg.textContent='Duration must be above zero.'; return; }
      row.minutes=f.minutes; row.amount=null;
    }
    try{
      await saveEntry(row, existing&&existing.id);
      toast(existing?'Saved.':'Logged '+(f.kind==='bonus'?eur(row.amount):hm(row.minutes))+' · '+dmy(f.date), true);
      if(!existing) S.draft=null;          // saved — start the next entry clean
      S.edit=null; render();
    }catch(e){ msg.className='msg err'; msg.textContent=navigator.onLine===false?'Offline — not saved.':e.message; }
  }
  async function del(){
    if(!del.armed){ del.armed=true; msg.className='msg err'; msg.textContent='Tap Delete again to confirm.'; return; }
    try{ await deleteEntry(existing.id); toast('Deleted.', true); S.edit=null; render(); }
    catch(e){ msg.className='msg err'; msg.textContent=e.message; }
  }
  draw();
  return box;
}

function entryRow(e){
  const d=parseKey(e.date);
  const val = e.kind==='bonus' ? eur(e.amount) : hm(e.minutes);
  const p = e.kind==='overtime' ? periodFor(e.date) : null;
  return el('div',{class:'row tap k-'+e.kind, onclick:()=>{ S.edit=e; render(); window.scrollTo(0,0); }},
    icon(e.kind),
    el('div',{class:'d'}, dmy(e.date).slice(0,5), el('small',null,DOW[d.getDay()])),

    el('div',{class:'v'}, val, p ? el('small',null, eur(e.minutes/60*p.ot_rate)) : null));
}

function yearTable(y){
  const months=[]; for(let i=0;i<12;i++){ const d=new Date(y,i,1); const c=monthCalc(d); if(c.rows.length) months.push([d,c]); }
  if(!months.length) return null;
  const qs={}; months.forEach(([d,c])=>{ const q=Math.floor(d.getMonth()/3)+1; (qs[q]=qs[q]||{n:0,ot:0,pay:0}); qs[q].ot+=c.ot; qs[q].pay+=c.otPay; });
  /* Average over every month of the quarter that has actually elapsed since logging
     began — not just the ones with entries, or a quiet month would vanish from the
     denominator and inflate the average. */
  const first=months[0][0], cur=monthStart(todayD());
  Object.keys(qs).forEach(q=>{
    let n=0; for(let i=(q-1)*3;i<q*3;i++){ const d=new Date(y,i,1); if(+d>=+first && +d<=+cur) n++; }
    qs[q].n=n||1;
  });
  const tot=months.reduce((a,[,c])=>({ot:a.ot+c.ot, pay:a.pay+c.otPay, cash:a.cash+c.cash}),{ot:0,pay:0,cash:0});
  return el('section',null,
    el('div',{class:'head'}, el('h2',null,String(y)), el('span',{class:'sub'}, hm(tot.ot)+' · '+eur(tot.pay))),
    el('table',null,
      el('tr',null, el('th',null,'Month'), el('th',null,'OT'), el('th',null,'OT pay'), el('th',null,'Cash')),
      months.map(([d,c])=>el('tr',{class:'tap'+(+d===+S.month?' cur':''), onclick:()=>{ S.month=d; S.edit=null; render(); window.scrollTo(0,0); }},
        el('td',null,MON[d.getMonth()]), el('td',null,hours(c.ot)+'h'), el('td',null,eur(c.otPay)), el('td',null,eur(c.cash))))),
    el('div',{class:'head', style:'margin-top:22px'}, el('h2',null,'Quarters')),
    el('table',null,
      el('tr',null, el('th',null,'Quarter'), el('th',null,'Avg / month'), el('th',null,'OT pay')),
      Object.keys(qs).map(q=>el('tr',null, el('td',null,'Q'+q), el('td',null,hours(qs[q].ot/qs[q].n)+'h'), el('td',null,eur(qs[q].pay))))));
}

/* ---------- CSV import ---------- */
/* Reads this app's own export and Greek-locale spreadsheet exports: BOM, CRLF,
   ';' delimiter, DD/MM/YYYY dates and comma decimals all survive. */
function parseCsv(text){
  text=text.replace(/^﻿/,'');
  const first=(text.split(/\r?\n/)[0]||'');
  const semi=(first.match(/;/g)||[]).length, comma=(first.match(/,/g)||[]).length;
  const D=semi>comma?';':',';
  const rows=[]; let cur=[], val='', q=false;
  for(let i=0;i<text.length;i++){
    const ch=text[i];
    if(q){ if(ch==='"'){ if(text[i+1]==='"'){ val+='"'; i++; } else q=false; } else val+=ch; }
    else if(ch==='"') q=true;
    else if(ch===D){ cur.push(val); val=''; }
    else if(ch==='\n'){ cur.push(val); rows.push(cur); cur=[]; val=''; }
    else if(ch!=='\r') val+=ch;
  }
  if(val!==''||cur.length){ cur.push(val); rows.push(cur); }
  return rows.filter(r=>r.some(c=>String(c).trim()!==''));
}
function csvDate(s){
  s=String(s||'').trim();
  let m=/^(\d{4})-(\d{1,2})-(\d{1,2})$/.exec(s);
  if(m) return m[1]+'-'+String(+m[2]).padStart(2,'0')+'-'+String(+m[3]).padStart(2,'0');
  m=/^(\d{1,2})[\/.\-](\d{1,2})[\/.\-](\d{4})$/.exec(s);          // DD/MM/YYYY
  if(m) return m[3]+'-'+String(+m[2]).padStart(2,'0')+'-'+String(+m[1]).padStart(2,'0');
  return null;
}
function csvNum(s){ const n=parseFloat(String(s==null?'':s).replace(/\s/g,'').replace(',','.')); return isNaN(n)?null:n; }
/* -> {rows:[entry], skipped:[{line,why}], dupes:n} */
function csvToEntries(text){
  const raw=parseCsv(text);
  if(!raw.length) return {rows:[], skipped:[], dupes:0};
  const head=raw[0].map(h=>String(h).trim().toLowerCase().replace(/^"|"$/g,''));
  const at=n=>head.indexOf(n);
  const iD=at('date'), iK=at('kind'), iM=at('minutes'), iH=at('hours'), iA=at('amount'), iN=at('note');
  if(iD<0) return {rows:[], skipped:[{line:1, why:'No "date" column found'}], dupes:0};
  const seen=new Set(S.entries.map(e=>e.date+'|'+e.kind+'|'+e.minutes+'|'+(e.amount==null?'':(+e.amount).toFixed(2))));
  const rows=[], skipped=[]; let dupes=0;
  for(let i=1;i<raw.length;i++){
    const c=raw[i], date=csvDate(c[iD]);
    if(!date){ skipped.push({line:i+1, why:'Unreadable date "'+String(c[iD]||'').trim()+'"'}); continue; }
    let kind=iK>=0 ? String(c[iK]||'').trim().toLowerCase() : 'overtime';
    if(!KINDS[kind]) kind='overtime';
    let minutes=iM>=0 ? csvNum(c[iM]) : null;
    if(minutes==null && iH>=0){ const h=csvNum(c[iH]); if(h!=null) minutes=Math.round(h*60); }
    minutes=minutes==null?0:Math.round(minutes);
    const amount=iA>=0 ? csvNum(c[iA]) : null;
    const note=iN>=0 ? String(c[iN]||'').trim() : '';
    if(kind==='bonus'){
      if(amount==null){ skipped.push({line:i+1, why:'Bonus with no amount'}); continue; }
      minutes=0;
    } else if(!(minutes>0)){ skipped.push({line:i+1, why:'Duration must be above zero'}); continue; }
    if(minutes>1440){ skipped.push({line:i+1, why:'Over 24 hours'}); continue; }
    const k=date+'|'+kind+'|'+minutes+'|'+(kind==='bonus'?(+amount).toFixed(2):'');
    if(seen.has(k)){ dupes++; continue; }
    seen.add(k);
    rows.push({date:date, kind:kind, minutes:minutes, amount:kind==='bonus'?amount:null, note:note||null});
  }
  return {rows:rows, skipped:skipped, dupes:dupes};
}
async function importEntries(rows){
  /* Chunked so one rejected row can't cost the whole file. */
  let done=0;
  for(let i=0;i<rows.length;i+=100){
    const part=rows.slice(i,i+100);
    const saved=await api('ot_entries',{method:'POST', body:part, headers:REP.headers});
    saved.forEach(r=>S.entries.push(r)); done+=saved.length;
  }
  sortEntries();
  return done;
}

/* ---------- auth views ---------- */
function renderAuth(){
  const app=document.getElementById('app'); app.innerHTML='';
  let mode='in';   // 'in' | 'up' | 'forgot'
  const email=el('input',{type:'email', placeholder:'Email', autocomplete:'username'});
  const pw=el('input',{type:'password', placeholder:'Password', autocomplete:'current-password'});
  const msg=el('p',{class:'msg'});
  /* The invite trigger on auth.users raises not_invited, which Supabase relays
     as an opaque "Database error saving new user". Say what actually happened. */
  function authError(e){
    const t=String(e&&e.message||'');
    if(/not_invited|Database error saving new user/i.test(t))
      return 'That email is not on the invite list yet.';
    if(/already registered|already been registered/i.test(t))
      return 'That email already has an account — sign in instead.';
    return t;
  }
  async function go(){
    msg.className='msg'; msg.textContent='Signing in…';
    try{ setSess(await authReq('token?grant_type=password',{email:email.value.trim(), password:pw.value})); boot(); }
    catch(e){ msg.textContent=authError(e); msg.className='msg err'; }
  }
  async function signUp(){
    const addr=email.value.trim();
    if(!addr){ msg.className='msg err'; msg.textContent='Enter your email.'; return; }
    if(pw.value.length<6){ msg.className='msg err'; msg.textContent='Password needs at least 6 characters.'; return; }
    msg.className='msg'; msg.textContent='Creating your account…';
    try{
      const d=await authReq('signup',{email:addr, password:pw.value});
      if(d&&d.access_token){ setSess(d); boot(); return; }
      msg.textContent='Account made. Check your email to confirm, then sign in.';
    }catch(e){ msg.textContent=authError(e); msg.className='msg err'; }
  }
  async function sendReset(){
    msg.className='msg'; msg.textContent='Sending reset link…';
    try{ await authReq('recover?redirect_to='+encodeURIComponent(location.origin+location.pathname),{email:email.value.trim()});
      msg.textContent='Check your email for a reset link.'; }
    catch(e){ msg.textContent=authError(e); msg.className='msg err'; }
  }
  function to(m){ mode=m; msg.textContent=''; msg.className='msg'; draw2(); }
  function draw2(){
    app.innerHTML='';
    pw.setAttribute('autocomplete', mode==='up'?'new-password':'current-password');
    pw.setAttribute('placeholder', mode==='up'?'Choose a password':'Password');
    app.appendChild(el('div',{class:'auth'},
      el('h1',null,'Overtime'),
      el('p',{class:'mut', style:'margin:-6px 0 4px'},
        mode==='up' ? 'Sign-up is invite only — your email has to be on the list.'
        : IS_BETA  ? 'Beta. This account is separate from the main app.'
                   : 'Same account as Ledger.'),
      email, mode==='forgot'?null:pw,
      mode==='forgot'
        ? el('div',{class:'btnrow'}, el('button',{class:'pri', onclick:sendReset},'Send reset link'),
            el('button',{onclick:()=>to('in')},'Back'))
        : mode==='up'
        ? el('div',{class:'btnrow'}, el('button',{class:'pri', onclick:signUp},'Create account'),
            el('button',{onclick:()=>to('in')},'Back'))
        : el('div',{class:'btnrow'}, el('button',{class:'pri', onclick:go},'Sign in')),
      mode==='in' ? el('button',{class:'authlink', onclick:()=>to('forgot')},'Forgot password?') : null,
      mode==='in' ? el('button',{class:'authlink', onclick:()=>to('up')},'Have an invite? Create an account') : null,
      msg));
  }
  pw.onkeydown=e=>{ if(e.key==='Enter'){ if(mode==='up') signUp(); else if(mode==='in') go(); } };
  draw2();
}
function renderResetPassword(rec){
  const app=document.getElementById('app'); app.innerHTML='';
  const pw=el('input',{type:'password', placeholder:'New password', autocomplete:'new-password'});
  const msg=el('p',{class:'msg'});
  async function go(){
    if(pw.value.length<6){ msg.textContent='At least 6 characters.'; msg.className='msg err'; return; }
    try{ await authReq('user',{password:pw.value},'PUT',rec.access_token); history.replaceState(null,'',location.pathname); setSess(rec); boot(); }
    catch(e){ msg.textContent=e.message; msg.className='msg err'; }
  }
  app.appendChild(el('div',{class:'auth'}, el('h1',null,'New password'), pw,
    el('div',{class:'btnrow'}, el('button',{class:'pri', onclick:go},'Save password')), msg));
}

  catch(e){ if(sess()){ document.getElementById('app').innerHTML=''; document.getElementById('app').appendChild(
      el('div',{class:'auth'}, el('h1',null,'Overtime'), el('p',{class:'msg err'}, navigator.onLine===false?'Offline.':e.message),
        el('div',{class:'btnrow'}, el('button',{class:'pri', onclick:boot},'Retry'), el('button',{onclick:()=>{ setSess(null); boot(); }},'Sign out')))); } }
  finally{ busy(false); }
}
/* Coming back to the PWA after hours: refetch so another device's entries show up. */
document.addEventListener('visibilitychange',()=>{ if(document.visibilityState==='visible' && sess() && S.share && !S.edit)
  loadAll().then(render).catch(()=>{}); });
boot();
</script>
